server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Compress text assets
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fingerprinted build assets: cache for a year
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files  $uri =404;
    }

    # Never cache the HTML entry point
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Unhashed files from public/: favicons and the social image
    location ~* ^/(favicon\.ico|favicon\.svg|apple-touch-icon\.png|og-image\.jpg)$ {
        expires    7d;
        add_header Cache-Control "public, max-age=604800";
        try_files  $uri =404;
    }

    # SPA and hash-anchor fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
